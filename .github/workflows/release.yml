name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - id: head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'missing or invalid release PR number' }
          $prJson = gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve release PR head SHA' }
          $pr = $prJson | ConvertFrom-Json
          if ($pr.state -ne 'open' -or $pr.number -ne [int]$env:PR_NUMBER) { throw 'release PR is not open or has the wrong number' }
          if ($pr.head.repo.full_name -ne $env:REPOSITORY) { throw 'release PR head must belong to this repository' }
          $sha = [string]$pr.head.sha
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'missing or invalid release PR head SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT

  test-release-pr:
    needs: resolve-release-pr
    if: needs.resolve-release-pr.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      sha: ${{ needs.resolve-release-pr.outputs.sha }}

  integration-release-pr:
    needs: resolve-release-pr
    if: needs.resolve-release-pr.outputs.sha != ''
    # GitHub validates the callee's permission ceiling even for skipped jobs.
    # Its execution/report jobs narrow to read-only; its writer rejects a SHA input.
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/integration.yml
    with:
      sha: ${{ needs.resolve-release-pr.outputs.sha }}

  mark-release-pr:
    needs: [resolve-release-pr, test-release-pr, integration-release-pr]
    if: always() && needs.resolve-release-pr.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve-release-pr.outputs.sha }}
          RESULT: ${{ needs.test-release-pr.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:SHA -notmatch '^[0-9a-f]{40}$') { throw 'missing or invalid release PR head SHA; cannot publish gate status' }
          $state = if ($env:RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:REPOSITORY/statuses/$env:SHA" -f state=$state -f context=gate -f target_url=$env:RUN_URL -f description="unit tests on the release PR commit: $state"
          if ($LASTEXITCODE -ne 0) { throw 'could not publish gate status on the release PR head SHA' }
      - if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve-release-pr.outputs.sha }}
          INTEGRATION_RESULT: ${{ needs.integration-release-pr.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:SHA -notmatch '^[0-9a-f]{40}$') { throw 'missing or invalid release PR head SHA; cannot publish integration status' }
          $state = if ($env:INTEGRATION_RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:REPOSITORY/statuses/$env:SHA" -f state=$state -f context=integration -f target_url=$env:RUN_URL -f description="integration tests on the release PR commit: $state"
          if ($LASTEXITCODE -ne 0) { throw 'could not publish integration status on the release PR head SHA' }
