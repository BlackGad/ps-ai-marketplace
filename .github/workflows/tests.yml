name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to test; empty tests the triggering commit
        type: string
        default: ''

permissions: {}

concurrency:
  group: tests-${{ inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - shell: pwsh
        run: pwsh -NoProfile -File tests/run.ps1 -JUnitPath results/unit-${{ runner.os }}.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ runner.os }}
          path: results
          if-no-files-found: ignore

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.legion/temp/python/env
      UV_CACHE_DIR: ${{ github.workspace }}/.legion/temp/python/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv run --project plugins/legion --frozen --group dev ruff check plugins/legion/src tests/python
      - run: uv run --project plugins/legion --frozen --group dev ruff format --check plugins/legion/src tests/python
      - run: uv run --project plugins/legion --frozen --group dev pyright
      - run: uv run --project plugins/legion --frozen --group dev pytest --rootdir=. -c plugins/legion/pyproject.toml

  parse-5-1:
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $pattern = '^(feat|fix|perf|docs|refactor|test|ci|chore)(\([a-z0-9-]+\))?!?: .+'
          if ($env:PR_TITLE -cnotmatch $pattern) {
            Write-Error "Pull request title is not a conventional commit subject: $env:PR_TITLE"
            exit 1
          }

  report:
    needs: unit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-*
          path: results
          merge-multiple: true
      - uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: results/*.xml
          check_name: unit results
          annotate_only: true

  gate:
    # Release PRs use the trusted commit status, including while PR runs await approval.
    name: ${{ (inputs.sha != '' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.head_ref, 'release-please--'))) && 'release PR tests' || 'gate' }}
    needs: [unit, python, parse-5-1, pr-title]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: pwsh
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PARSE_RESULT: ${{ needs.parse-5-1.result }}
          TITLE_RESULT: ${{ needs.pr-title.result }}
        run: |
          # pr-title is skipped on push and workflow_call runs; that counts as success
          $failed = @()
          if ($env:UNIT_RESULT -ne 'success') { $failed += "unit: $env:UNIT_RESULT" }
          if ($env:PYTHON_RESULT -ne 'success') { $failed += "python: $env:PYTHON_RESULT" }
          if ($env:PARSE_RESULT -ne 'success') { $failed += "parse-5-1: $env:PARSE_RESULT" }
          if ($env:TITLE_RESULT -notin 'success', 'skipped') { $failed += "pr-title: $env:TITLE_RESULT" }
          if ($failed) {
            Write-Error ($failed -join '; ')
            exit 1
          }
