<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">The overseer and legion workflow</title>
  <desc id="desc">The owner directs the overseer. It dispatches tasks to Claude Code, Codex CLI and Copilot CLI members on different accounts. Their reports return for review, then a repository handoff supports the next session.</desc>
