    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#91aaa9" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="12" fill="#192630" stroke="#607580"/>
  <g fill="none" stroke="#91aaa9" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M184 96H248"/>
    <path d="M448 96H560V76H620"/>
    <path d="M560 96V160H620"/>
    <path d="M560 160V244H620"/>
    <path d="M914 76H934V310H450"/>
    <path d="M914 160H934"/>
    <path d="M914 244H934"/>
    <path d="M348 270V140"/>
    <path d="M248 310H210"/>
    <path d="M116 354V388H226V186H300V140" stroke-dasharray="5 5"/>
  </g>
  <g font-family="sans-serif" fill="#e0e8ec" font-size="22" text-anchor="middle">
