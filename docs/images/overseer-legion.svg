    <text x="532" y="64" font-size="18" fill="#a6b6c1">Tasks</text>
    <rect x="620" y="36" width="294" height="80" rx="6" fill="#2c3c49" stroke="#718593"/>
    <text x="767" y="68">Claude Code</text>
    <text x="767" y="98" font-size="18" fill="#b9ced0">Legion · account A</text>
    <rect x="620" y="120" width="294" height="80" rx="6" fill="#2c3c49" stroke="#718593"/>
    <text x="767" y="152">Codex CLI</text>
    <text x="767" y="182" font-size="18" fill="#b9ced0">Legion · account B</text>
