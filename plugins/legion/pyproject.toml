[project]
name = "legion"
dynamic = ["version"]
description = "Python helpers for the legion plugin"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "filelock>=4.3.1,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "psutil>=7,<8",
    "tomlkit>=0.15.3,<0.16",
    "truststore>=0.10,<1",
]

[project.scripts]
legion = "legion.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[dependency-groups]
dev = ["ruff>=0.14.9", "pyright>=1.1.408", "pytest>=9.0.2", "pytest-cov>=7.0.0"]
installed = ["legion[mcp]"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"plugin.json" = "legion/_plugin_data/plugin.json"
"tools.json" = "legion/_plugin_data/tools.json"
"helpers.json" = "legion/_plugin_data/helpers.json"
"skills" = "legion/_plugin_data/skills"

[tool.uv]
default-groups = ["installed"]
cache-keys = [{ file = "pyproject.toml" }, { file = "plugin.json" }, { file = "hatch_build.py" }, { dir = "src" }]
