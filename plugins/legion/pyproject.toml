[project]
name = "legion"
# Packaging placeholder only; the CLI reads plugin.json for the released version.
version = "0.0.0"
description = "Python helpers for the legion plugin"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "filelock>=4.3.1,<5",
    "pydantic>=2.11,<3",
    "psutil>=7,<8",
    "tomlkit>=0.15.3,<0.16",
]

[project.scripts]
legion = "legion.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[dependency-groups]
# Default group: the 0.17.0 updater runs plain `uv sync`, so MCP must come without the extra flag.
installed = ["legion[mcp]"]
dev = ["ruff>=0.14.9", "pyright>=1.1.408", "pytest>=9.0.2", "pytest-cov>=7.0.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["installed"]
